spring:
  datasource:
    url: jdbc:h2:mem:product-local;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
migration:
  security:
    require-https: false
    users:
      - username: admin
        password: ${PRODUCT_DEMO_PASSWORD}
        authorities:
          - OFBTOOLS_ADMIN
          - CATALOG_ADMIN
          - FACILITY_ADMIN
          - PRODUCT_ADMIN
          - PRODUCT_SENSITIVE_VIEW
          - CATALOG_PRICE_MAINT
          - CATALOG_VIEW
          - CATALOG_CREATE
          - CATALOG_UPDATE
          - CATALOG_DELETE
          - FACILITY_VIEW
          - FACILITY_CREATE
          - FACILITY_UPDATE
          - FACILITY_DELETE
      - username: readonly
        password: ${PRODUCT_DEMO_PASSWORD}
        authorities:
          - OFBTOOLS_VIEW
          - CATALOG_VIEW
          - FACILITY_VIEW
      - username: nofacility
        password: ${PRODUCT_DEMO_PASSWORD}
        authorities:
          - OFBTOOLS_VIEW
          - CATALOG_VIEW
      - username: sensitive
        password: ${PRODUCT_DEMO_PASSWORD}
        authorities:
          - OFBTOOLS_VIEW
          - CATALOG_VIEW
          - FACILITY_VIEW
          - FACILITY_CREATE
          - FACILITY_UPDATE
          - PRODUCT_SENSITIVE_VIEW
