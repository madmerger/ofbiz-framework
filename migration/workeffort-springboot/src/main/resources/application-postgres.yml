spring:
  datasource:
    url: ${MIGRATION_DB_URL:jdbc:postgresql://localhost:5432/workeffort}
    username: ${MIGRATION_DB_USERNAME:workeffort}
    password: ${MIGRATION_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
migration:
  security:
    component: workeffort
    require-https: true
server:
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: '${MIGRATION_SECURITY_TRUSTED_PROXIES:a^}'
