plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.7'
    id 'io.spring.dependency-management' version '1.1.7'
}

java { toolchain { languageVersion = JavaLanguageVersion.of(17) } }

dependencies {
    implementation project(':migration:springboot-common')
    implementation project(':migration:springboot-datamodel')
    ['party', 'order', 'product', 'accounting', 'workeffort', 'marketing', 'content', 'manufacturing'].each {
        implementation project(":migration:${it}-springboot")
    }
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    runtimeOnly 'org.postgresql:postgresql'
}

tasks.named('bootRun') {
    systemProperty 'ofbiz.root', rootProject.projectDir.absolutePath
}
