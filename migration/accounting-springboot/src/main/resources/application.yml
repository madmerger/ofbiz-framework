spring:
  application:
    name: accounting-springboot
  datasource:
    url: jdbc:h2:mem:accounting;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    serialization:
      write-dates-as-timestamps: false
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
server:
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: '${MIGRATION_SECURITY_TRUSTED_PROXIES:a^}'
management:
  endpoints:
    web:
      exposure:
        include: health
migration:
  security:
    component: accounting
    base-permissions:
      - OFBTOOLS
      - ACCOUNTING
    service-permission-prefix: ACCOUNTING
    trusted-proxies: '${MIGRATION_SECURITY_TRUSTED_PROXIES:a^}'
    extra-entities:
      - StatusItem
      - StatusValidChange
      - Party
      - PartyRole
      - OrderHeader
      - OrderRole
      - OrderItem
      - OrderItemBilling
      - Product
      - ProductStore
      - Invoice
      - InvoiceItem
      - InvoiceStatus
      - InvoiceItemTypeMap
      - Payment
      - PaymentApplication
      - PaymentMethod
      - PaymentMethodType
      - CreditCard
      - PartyRelationship
      - PartyGroup
      - ProductGlAccount
      - ProductCategoryGlAccount
      - ProductCategoryMember
      - FinAccount
      - FinAccountStatus
      - FinAccountTrans
      - FinAccountAuth
      - FinAccountRole
      - GlReconciliation
      - AcctgTransEntry
      - GlReconciliationEntry
      - PaymentGroupMember
    sensitive-entities:
      - PaymentMethod
      - CreditCard
      - EftAccount
      - CheckAccount
      - GiftCard
      - PayPalPaymentMethod
      - FinAccount
      - FinAccountTrans
      - FinAccountAuth
      - FinAccountRole
      - PaymentGatewayResponse
      - PaymentGatewayRespMsg
      - PaymentGatewayConfig
      - PaymentGatewayConfigType
