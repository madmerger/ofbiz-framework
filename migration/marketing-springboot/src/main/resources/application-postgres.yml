spring:
  datasource:
    url: ${MARKETING_DB_URL:jdbc:postgresql://localhost:5432/marketing}
    username: ${MARKETING_DB_USERNAME:marketing}
    password: ${MARKETING_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
migration:
  security:
    require-https: true
    trusted-proxies: '${MIGRATION_SECURITY_TRUSTED_PROXIES:a^}'
