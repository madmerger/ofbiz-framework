spring:
  application:
    name: marketing-springboot
  datasource:
    url: jdbc:h2:mem:marketing;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    serialization:
      write-dates-as-timestamps: false
server:
  forward-headers-strategy: native
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health
migration:
  security:
    # ofbiz-component.xml の marketing webapp（base-permission="OFBTOOLS,MARKETING"）に合わせる
    base-permissions:
      - OFBTOOLS
      - MARKETING
    service-permission-prefix: MARKETING
    # 既定では信頼するプロキシなし（正規表現 a^ はどの IP にも一致しない）
    trusted-proxies: '${MIGRATION_SECURITY_TRUSTED_PROXIES:a^}'
    require-https: false
    users: []
    # 決済・カード・口座・給与・認証情報などの機密 Entity。閲覧には MARKETING_SENSITIVE_VIEW が必要
    sensitive-entities:
      - UserLogin
      - UserLoginHistory
      - UserLoginPasswordHistory
      - UserLoginSecurityQuestion
      - PaymentMethod
      - CreditCard
      - EftAccount
      - GiftCard
      - BillingAccount
      - FinAccount
      - FinAccountTrans
      - Payment
      - PaymentGatewayResponse
      - PayHistory
      - PayrollPreference
      - PartyBenefit
      - SalaryStep
      - PayGrade
