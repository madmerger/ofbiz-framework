spring:
  datasource:
    url: ${HUMANRES_DB_URL:jdbc:postgresql://localhost:5432/humanres}
    username: ${HUMANRES_DB_USERNAME:humanres}
    password: ${HUMANRES_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
migration:
  security:
    require-https: true
server:
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: '${MIGRATION_SECURITY_TRUSTED_PROXIES:a^}'
