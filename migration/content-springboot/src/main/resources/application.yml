spring:
  application:
    name: content-springboot
  datasource:
    url: jdbc:h2:mem:content;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    serialization:
      write-dates-as-timestamps: false
server:
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: '${MIGRATION_SECURITY_TRUSTED_PROXIES:a^}'
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health
migration:
  security:
    component: content
    # 既定は HTTPS 必須（local/テストのみ明示的に false）
    require-https: true
    # applications/content/ofbiz-component.xml の webapp base-permission="OFBTOOLS,CONTENTMGR"
    base-permissions:
      - OFBTOOLS
      - CONTENTMGR
    service-permission-prefix: CONTENTMGR
    trusted-proxies: '${MIGRATION_SECURITY_TRUSTED_PROXIES:a^}'
    users: []
    # catalog 外だが移植サービス（createSurveyResponse）が書き込む Entity を Entity API に公開する
    extra-entities:
      - SurveyResponse
      - SurveyResponseAnswer
    # 決済・カード・口座・給与・認証情報などの機密エンティティ（*_SENSITIVE_VIEW か *_ADMIN が必要）
    sensitive-entities:
      - UserLogin
      - UserLoginHistory
      - UserLoginPasswordHistory
      - UserLoginSecurityQuestion
      - CreditCard
      - GiftCard
      - BankAccount
      - EftAccount
      - PaymentMethod
      - Payment
      - PaymentGatewayResponse
      - FinAccount
      - FinAccountTrans
      - PayHistory
      - PayrollPreference
      - SurveyResponse
      - SurveyResponseAnswer
