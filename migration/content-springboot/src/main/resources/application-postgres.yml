spring:
  datasource:
    url: ${CONTENT_DB_URL:jdbc:postgresql://localhost:5432/content}
    username: ${CONTENT_DB_USERNAME:content}
    password: ${CONTENT_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
migration:
  security:
    require-https: true
    trusted-proxies: '${MIGRATION_SECURITY_TRUSTED_PROXIES:a^}'
server:
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: '${MIGRATION_SECURITY_TRUSTED_PROXIES:a^}'
