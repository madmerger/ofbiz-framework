spring:
  datasource:
    url: ${COMMONEXT_DB_URL:jdbc:postgresql://localhost:5432/commonext}
    username: ${COMMONEXT_DB_USERNAME:commonext}
    password: ${COMMONEXT_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

migration:
  security:
    require-https: true
    trusted-proxies: ${MIGRATION_SECURITY_TRUSTED_PROXIES:a^}
